name: Prepare candidate release draft

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Intended distribution channel after acceptance
        required: true
        default: GitHub-Release
      candidate:
        description: Repository-relative candidate produced by the reviewed build
        required: true
        default: dist/mnknowledgebase_v1_87.mnaddon

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, node24
        with:
          node-version: '24'
      - name: Run source checks
        run: node ci/run-checks.mjs ci/commands.json
      - name: Build a local candidate using the reviewed explicit command list
        run: node ci/run-checks.mjs ci/candidate-commands.json
      - name: Verify the exact runtime whitelist and prepare the candidate draft
        env:
          CANDIDATE: ${{ inputs.candidate }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          node build/build.js --verify "$CANDIDATE" > dist/release-verification.json
          {
            printf '# Candidate release draft\n\nSource commit: `%s`\n\nChannel: %s\n\n' "$GITHUB_SHA" "$CHANNEL"
            printf 'Package SHA-256: '
            sha256sum "$CANDIDATE"
            printf '\n```json\n'
            cat mnaddon.json
            cat dist/release-verification.json
            printf '\n```\n\nDevice acceptance remains pending. This draft does not publish or distribute the candidate.\n'
          } | tee dist/release-draft.md >> "$GITHUB_STEP_SUMMARY"
